  <style>
    :root{--bg:#111; --accent:#ffcc00; --text:#eee; font-family:system-ui,sans-serif;}

    body{background:var(--bg);color:var(--text);line-height:1.5}
    header{text-align:center;padding:4rem 1rem 2rem}
    header img{width:180px;height:180px;border-radius:50%;border:4px solid var(--accent)}

    section{padding:2rem 1rem;max-width:700px;margin:auto}
    .btn{display:inline-block;background:var(--accent);color:#000;padding:.75rem 1.5rem;border-radius:4px;text-decoration:none;font-weight:700;margin:.5rem 0}
    footer{text-align:center;padding:3rem 1rem;font-size:.8rem;color:#777}
    iframe{width:100%;height:80px;border:0;margin:.5rem 0}
  </style>
</head>
