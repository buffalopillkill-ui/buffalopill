<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Buffalo Pill</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <meta property="og:title" content="Buffalo Pill">
  <meta property="og:description" content="Heavy-hitting bars straight outta Woodsboro. New music soon.">
  <meta property="og:image" content="https://buffalopill.pages.dev/cover.jpg">
  <meta property="og:type" content="website">
  <!-- dark / light favicon -->
  <link rel="icon" href="https://buffalopill.pages.dev/favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="https://buffalopill.pages.dev/favicon-light.png" media="(prefers-color-scheme: light)">
  <style>
  :root{
    --bg:#0a0a0a;
    --accent:#f9c80e;
    --text:#eee;
    --sub:#999;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* bigger type scale + breathing room */
  h1{font-size:clamp(2.5rem,5vw,4rem)}
  h2{font-size:clamp(1.6rem,3vw,2.4rem)}
  p.sub{font-size:clamp(1rem,2vw,1.25rem)}
  section{padding:clamp(3rem,8vw,6rem) 1.5rem;max-width:900px;margin:auto}

  /* sticky nav */
  nav{position:fixed;top:0;left:0;right:0;background:rgba(10,10,10,.85);backdrop-filter:blur(8px);border-bottom:1px solid #222;display:flex;gap:1.5rem;padding:1rem 2rem;z-index:10}
  nav a{color:var(--sub);text-decoration:none;font-weight:500;transition:.2s}
  nav a:hover{color:var(--accent)}

  /* header + parallax */
  header{position:relative;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;flex-wrap:wrap;gap:3rem;overflow:hidden}
  header img{width:clamp(180px,20vw,280px);height:clamp(180px,20vw,280px);border-radius:50%;border:4px solid var(--accent);object-fit:cover;box-shadow:0 0 30px rgba(249,200,14,.35);will-change:transform;transition:transform .1s linear}
  h1{margin:.5rem 0;letter-spacing:-1px}
  p.sub{color:var(--sub)}

  /* glass-morphism cards */
  .glass{background:rgba(30,30,30,.45);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:2rem;backdrop-filter:blur(12px)}

  /* buttons / iframe */
  .btn{display:inline-block;background:var(--accent);color:#000;padding:.85rem 1.8rem;border-radius:6px;text-decoration:none;font-weight:700;margin:.5rem .25rem;transition:.2s}
  .btn:hover{filter:brightness(1.1)}
  iframe{width:100%;height:152px;border:0;border-radius:6px;margin:.75rem 0}
  .vid-wall{display:none;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;margin-top:1rem}
  .vid-wall.active{display:grid}

  footer{text-align:center;padding:3rem 1rem;font-size:.8rem;color:var(--sub)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  header,section,footer{animation:fadeUp .8s ease-out}
  html{scroll-behavior:smooth}
  @media (max-width:900px){nav{justify-content:center}header{flex-direction:column;gap:1.5rem}}
  </style>
</head>
<body>

<!-- STICKY NAV -->
<nav>
  <a href="#music">Music</a>
  <a href="#videos">Videos</a>
  <a href="#updates">Updates</a>
  <a href="#socials">Socials</a>
</nav>

<header>
  <img src="cover.jpg" alt="Buffalo Pill">
  <div>
    <h1>Buffalo Pill</h1>
    <p class="sub">straight outta woodsboro</p>
    <a href="#music" class="btn">Hear Now</a>
  </div>
</header>

<section id="music" class="glass">
  <h2>LATEST RELEASE</h2>
  <iframe src="https://open.spotify.com/embed/artist/0KT9MzDOenp2Fa2TbUAJSL?utm_source=generator" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  <a class="btn" href="https://open.spotify.com/artist/0KT9MzDOenp2Fa2TbUAJSL" target="_blank" rel="noopener">Spotify</a>
  <a class="btn" href="https://music.apple.com/us/artist/buffalo-pill/1853023050" target="_blank" rel="noopener">Apple Music</a>
  <a class="btn" href="https://soundcloud.com/buffalo-pill" target="_blank" rel="noopener">SoundCloud</a>
</section>

<section id="videos" class="glass">
  <h2>NEW OFFICIAL YDOBON MUSIC VIDEO</h2>
  <iframe width="100%" height="315" src="https://www.youtube.com/embed/fi91y84H-og" title="YouTube video player" frameborder="0" allowfullscreen></iframe>
  <button class="btn" onclick="toggleWall()">Watch More</button>
  <div class="vid-wall" id="wall">
    <iframe src="https://www.youtube.com/embed/elQ_1hpXzjU" title="vid1" loading="lazy"></iframe>
    <iframe src="https://www.youtube.com/embed/cbblpXQ3l20" title="vid2" loading="lazy"></iframe>
    <iframe src="https://www.youtube.com/embed/nJbpTs2Oedg" title="vid3" loading="lazy"></iframe>
    <iframe src="https://www.youtube.com/embed/Hz7aMDYH8Bw" title="vid4" loading="lazy"></iframe>
    <iframe src="https://www.youtube.com/embed/3tfCjVQfEB8" title="vid5" loading="lazy"></iframe>
    <iframe src="https://www.youtube.com/embed/fi91y84H-og" title="vid6" loading="lazy"></iframe>
  </div>
</section>

<section id="updates" class="glass">
  <h2>Stay Updated</h2>
  <a class="btn" href="https://buttondown.email/buffalopill" target="_blank" rel="noopener">Join the mailing list</a>
</section>

<section id="socials" class="glass">
  <h2>Socials</h2>
  <a href="https://www.instagram.com/buff.alopill/" target="_blank" rel="noopener">Instagram</a> |
  <a href="https://x.com/BuffaloPill" target="_blank" rel="noopener">X</a>
</section>

<footer>
  NEW MUSIC SOON <span id="secret" style="cursor:pointer;">❤️</span> YOU ARE GOING TO LOVE THE NEXT FOLLOWING MONTHS
</footer>

<!-- SCRIPTS -->
<audio id="s" src="https://buffalopill.pages.dev/secret.mp3" preload="auto"></audio>
<script>
document.getElementById('secret').onclick = function(){document.getElementById('s').play()};
function toggleWall(){
  document.getElementById('wall').classList.toggle('active');
}
</script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "YOUR-TOKEN-HERE"}'></script>

</body>
</html>
