  <style>
   :root{
  --bg:#0a0a0a;
  --card:#1a1a1a;
  --accent:#f9c80e;
  --text:#eee;
  --sub:#999;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5
}
*{box-sizing:border-box;margin:0;padding:0}
header{min-height:100vh;display:grid;place-content:center;text-align:center;padding:2rem}
header img{width:240px;height:240px;border-radius:50%;border:4px solid var(--accent);object-fit:cover;box-shadow:0 0 30px rgba(249,200,14,.35)}
h1{font-size:3rem;margin:.5rem 0;letter-spacing:-1px}
p.sub{font-size:1.1rem;color:var(--sub)}
section{max-width:800px;margin:auto;padding:4rem 1.5rem}
h2{margin-bottom:1rem;font-size:1.8rem}
.btn{display:inline-block;background:var(--accent);color:#000;padding:.85rem 1.8rem;border-radius:6px;text-decoration:none;font-weight:700;margin:.5rem .25rem;transition:.2s}
.btn:hover{filter:brightness(1.1)}
iframe{width:100%;height:152px;border:0;border-radius:6px;margin:.75rem 0}
footer{text-align:center;padding:3rem 1rem;font-size:.8rem;color:var(--sub)}
@media(max-width:600px){h1{font-size:2.2rem}header img{width:180px;height:180px}}
  </style>
</head>
